<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus — Learn, Solve, Develop</title>
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.dataset.theme = localStorage.getItem("nexus-theme") || "dark";</script>
</head>
<body>

<main style="max-width:720px; margin:0 auto; padding:64px 24px 100px;">

  <div style="text-align:center; margin-bottom:56px;">
    <div style="font-family:var(--font-display); font-weight:700; font-size:22px; display:flex; align-items:center; justify-content:center; gap:8px;">
      <span style="color:var(--tier-transcendent);">◆</span> Nexus
    </div>
  </div>

  <h2 style="font-size:18px; margin-bottom:16px;">홍보</h2>
  <div style="display:flex; flex-direction:column; gap:14px;">

    <a href="https://llogis.xyz" target="_blank" rel="noopener" class="card" style="display:block; text-decoration:none;">
      <strong style="color:var(--text); font-family:var(--font-display);">llogis.xyz</strong>
      <p style="font-size:13px; margin:6px 0 0;">주인장이 게으른 수학 OJ</p>
    </a>

    <a href="https://jay-0216.github.io/clicker_kingdom/index.html" target="_blank" rel="noopener" class="card" style="display:block; text-decoration:none;">
      <strong style="color:var(--text); font-family:var(--font-display);">Clicker Kingdom</strong>
      <p style="font-size:13px; margin:6px 0 0; white-space:pre-line;">당신만의 위대한 제국을 건설하세요
단 한 번의 클릭에서 시작해 강력한 군대를 고용하고,
다른 제국과 펼쳐지는 10초 실시간 클릭 대전에서 승리해 명예의 전당에 이름을 올리세요.</p>
    </a>

  </div>

</main>

</body>
</html>
