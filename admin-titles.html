<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>칭호 관리 · Nexus</title>
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.dataset.theme = localStorage.getItem("nexus-theme") || "dark";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
<div id="nav-root"></div>

<main class="page" style="padding-top:32px; max-width:640px;">
  <a href="admin.html" class="btn btn--ghost" style="font-size:13px; padding:6px 10px; margin-bottom:12px;">← 관리자 메뉴</a>
  <h1>칭호 관리</h1>
  <div id="guard-msg"></div>

  <div id="admin-body" style="display:none;">
    <section class="admin-section">
      <form id="title-form" class="card">
        <div class="field">
          <label>획득 방식</label>
          <select id="t-type">
            <option value="auto_tier">자동 - 티어 승급</option>
            <option value="auto_solved_count">자동 - 누적 풀이수</option>
            <option value="purchase">구매형</option>
            <option value="manual">기타 (조건 직접 입력, 관리자가 수동 지급)</option>
          </select>
        </div>
        <div class="field"><label>칭호 이름</label><input id="t-name" type="text" required></div>

        <div id="t-tier-fields">
          <div class="field">
            <label>과목</label>
            <select id="t-subject">
              <option value="math">수학</option>
              <option value="science">과학</option>
              <option value="korean">국어</option>
              <option value="coding">코딩</option>
            </select>
          </div>
          <div class="field"><label>티어 레벨 (0~17)</label><input id="t-tier-level" type="number" min="0" max="17" value="0"></div>
        </div>
        <div id="t-count-fields" style="display:none;">
          <div class="field"><label>누적 풀이수 기준</label><input id="t-count" type="number" min="1"></div>
        </div>
        <div id="t-price-fields" style="display:none;">
          <div class="field"><label>가격 (코인)</label><input id="t-price" type="number" min="1"></div>
        </div>
        <div id="t-manual-fields" style="display:none;">
          <div class="field">
            <label>취득 조건 (자유 입력, 자동 지급 안 되고 참고용 설명이에요)</label>
            <input id="t-condition" type="text" placeholder="예: 대회 1등 수상, 이벤트 참여 등">
          </div>
        </div>

        <button type="submit" class="btn btn--primary">칭호 추가</button>
        <div id="title-msg" class="form-msg"></div>
      </form>
    </section>
  </div>
</main>

<script src="js/supabase-client.js"></script>
<script src="js/tier.js"></script>
<script src="js/nav.js"></script>
<script>
async function init() {
  await renderNav("admin");
  const user = await requireAuth();
  if (!user) return;

  const { data: profile } = await sb.from("profiles").select("is_admin, is_super_admin").eq("id", user.id).single();
  if (!profile?.is_admin && !profile?.is_super_admin) {
    document.getElementById("guard-msg").innerHTML = `<p style="color:var(--danger)">관리자 계정만 접근할 수 있어요.</p>`;
    return;
  }
  document.getElementById("admin-body").style.display = "block";

  document.getElementById("t-type").addEventListener("change", (e) => {
    const v = e.target.value;
    document.getElementById("t-tier-fields").style.display = v === "auto_tier" ? "block" : "none";
    document.getElementById("t-count-fields").style.display = v === "auto_solved_count" ? "block" : "none";
    document.getElementById("t-price-fields").style.display = v === "purchase" ? "block" : "none";
    document.getElementById("t-manual-fields").style.display = v === "manual" ? "block" : "none";
  });

  document.getElementById("title-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("title-msg");
    const acquire_type = document.getElementById("t-type").value;
    const name = document.getElementById("t-name").value.trim();

    const row = { name, acquire_type };
    if (acquire_type === "auto_tier") {
      row.subject = document.getElementById("t-subject").value;
      row.tier_level = parseInt(document.getElementById("t-tier-level").value, 10);
    } else if (acquire_type === "auto_solved_count") {
      row.solved_count_threshold = parseInt(document.getElementById("t-count").value, 10);
    } else if (acquire_type === "purchase") {
      row.price = parseInt(document.getElementById("t-price").value, 10);
    } else {
      row.condition_description = document.getElementById("t-condition").value.trim();
    }

    const { error } = await sb.from("titles").insert(row);
    msg.textContent = error ? error.message : "칭호를 추가했어요.";
    msg.className = "form-msg " + (error ? "form-msg--error" : "form-msg--success");
    if (!error) e.target.reset();
  });
}
init();
</script>
</body>
</html>
