<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상점 · Nexus</title>
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.dataset.theme = localStorage.getItem("nexus-theme") || "dark";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
<div id="nav-root"></div>

<main class="page" style="padding-top:32px;">
  <h1>코인상점</h1>
  <p id="balance-line"></p>

  <h2 style="margin-top:28px;">배경 &amp; 테마</h2>
  <div id="items-grid" class="shop-grid"></div>

  <h2 style="margin-top:36px;">구매 가능한 칭호</h2>
  <div id="titles-grid" class="shop-grid"></div>
</main>

<script src="js/supabase-client.js"></script>
<script src="js/tier.js"></script>
<script src="js/nav.js"></script>
<script>
let currentUser = null;
let ownedItemIds = new Set();
let ownedTitleIds = new Set();

async function refreshBalance() {
  const { data: profile } = await sb.from("profiles").select("coin_balance").eq("id", currentUser.id).single();
  document.getElementById("balance-line").innerHTML = `보유 코인 <strong style="color:var(--tier-transcendent)">🪙 ${profile?.coin_balance ?? 0}</strong>`;
  return profile?.coin_balance ?? 0;
}

async function loadShop() {
  currentUser = await requireAuth();
  if (!currentUser) return;

  await refreshBalance();

  const { data: inventory } = await sb.from("user_inventory").select("item_id").eq("user_id", currentUser.id);
  ownedItemIds = new Set((inventory ?? []).map(i => i.item_id));

  const { data: userTitles } = await sb.from("user_titles").select("title_id").eq("user_id", currentUser.id);
  ownedTitleIds = new Set((userTitles ?? []).map(t => t.title_id));

  const { data: items } = await sb.from("shop_items").select("*").order("price", { ascending: true });
  const itemsGrid = document.getElementById("items-grid");
  if (!items || items.length === 0) {
    itemsGrid.innerHTML = `<div class="empty-state">등록된 상품이 없어요.</div>`;
  } else {
    itemsGrid.innerHTML = items.map(item => {
      const owned = ownedItemIds.has(item.id);
      return `
        <div class="shop-item">
          <div class="shop-item__preview" style="${item.image_url ? `background-image:url(${item.image_url}); background-size:cover;` : ""}"></div>
          <strong>${item.name}</strong>
          <span style="font-size:12px; color:var(--text-muted);">${item.type === "background" ? "프로필 배경" : "테마 변경권"}</span>
          <span class="shop-item__price">🪙 ${item.price}</span>
          <button class="btn ${owned ? "btn--ghost" : "btn--primary"}" data-id="${item.id}" data-kind="item" ${owned ? "disabled" : ""}>
            ${owned ? "보유중" : "구매"}
          </button>
        </div>
      `;
    }).join("");
  }

  const { data: titles } = await sb.from("titles").select("*").eq("acquire_type", "purchase").order("price", { ascending: true });
  const titlesGrid = document.getElementById("titles-grid");
  if (!titles || titles.length === 0) {
    titlesGrid.innerHTML = `<div class="empty-state">구매 가능한 칭호가 없어요.</div>`;
  } else {
    titlesGrid.innerHTML = titles.map(t => {
      const owned = ownedTitleIds.has(t.id);
      return `
        <div class="shop-item">
          <strong>${t.name}</strong>
          <span class="shop-item__price">🪙 ${t.price}</span>
          <button class="btn ${owned ? "btn--ghost" : "btn--primary"}" data-id="${t.id}" data-kind="title" ${owned ? "disabled" : ""}>
            ${owned ? "보유중" : "구매"}
          </button>
        </div>
      `;
    }).join("");
  }

  document.querySelectorAll("button[data-kind]").forEach(btn => {
    btn.addEventListener("click", () => purchase(btn.dataset.kind, btn.dataset.id));
  });
}

async function purchase(kind, id) {
  const rpcName = kind === "item" ? "purchase_item" : "purchase_title";
  const paramName = kind === "item" ? "p_item_id" : "p_title_id";
  const { data, error } = await sb.rpc(rpcName, { [paramName]: id });

  if (error) { alert("구매 중 오류: " + error.message); return; }

  const row = data[0];
  if (!row.success) {
    alert("코인이 부족해요.");
    return;
  }
  loadShop();
}

renderNav("shop");

loadShop();
</script>
</body>
</html>
