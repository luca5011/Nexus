<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>채점 기록 · Nexus</title>
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.dataset.theme = localStorage.getItem("nexus-theme") || "dark";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
<div id="nav-root"></div>

<main class="page" style="padding-top:32px;">
  <h1>채점 기록</h1>
  <p>모든 유저의 채점 결과를 볼 수 있어요. 제출한 답 내용은 표시되지 않아요.</p>

  <div id="subject-tabs" class="subject-tabs"></div>

  <div class="card">
    <div class="field">
      <label>아이디로 검색</label>
      <input id="sub-search" type="text" placeholder="username 입력 후 Enter">
    </div>
  </div>

  <div class="card" style="padding:0; overflow:hidden; margin-top:12px;">
    <table class="problem-table">
      <thead>
        <tr><th>결과</th><th>유저</th><th>과목</th><th>문제</th><th>시각</th></tr>
      </thead>
      <tbody id="submissions-rows"></tbody>
    </table>
    <div id="submissions-empty" class="empty-state" style="display:none;">제출 기록이 없어요.</div>
  </div>
</main>

<script src="js/supabase-client.js"></script>
<script src="js/tier.js"></script>
<script src="js/nav.js"></script>
<script>
let currentSubject = "all";
let currentUsername = "";

function renderTabs() {
  const el = document.getElementById("subject-tabs");
  const tabs = [{ key: "all", label: "전체" }, ...SUBJECT_ORDER.filter(k => !SUBJECTS[k].disabled).map(k => ({ key: k, label: `${SUBJECTS[k].icon} ${SUBJECTS[k].label}` }))];

  el.innerHTML = tabs.map(t => `
    <button class="subject-tab ${t.key === currentSubject ? "active" : ""}" data-subject="${t.key}">${t.label}</button>
  `).join("");

  el.querySelectorAll(".subject-tab").forEach(btn => {
    btn.addEventListener("click", () => {
      currentSubject = btn.dataset.subject;
      renderTabs();
      loadSubmissions();
    });
  });
}

async function loadSubmissions() {
  const rowsEl = document.getElementById("submissions-rows");
  const emptyEl = document.getElementById("submissions-empty");
  rowsEl.innerHTML = "";

  const user = await requireAuth();
  if (!user) return;

  // 정답 내용은 애초에 이 함수가 반환하지 않음 (서버에서 컬럼 자체를 안 줌)
  const { data: subs, error } = await sb.rpc("get_public_submissions", {
    p_subject: currentSubject === "all" ? null : currentSubject,
    p_username: currentUsername || null,
    p_limit: 100,
  });

  if (error || !subs || subs.length === 0) {
    emptyEl.style.display = "block";
    emptyEl.textContent = error ? "불러오는 중 오류가 발생했어요: " + error.message : "제출 기록이 없어요.";
    return;
  }
  emptyEl.style.display = "none";

  rowsEl.innerHTML = subs.map(s => `
    <tr>
      <td class="${s.is_correct ? "problem-row-solved" : ""}" style="${s.is_correct ? "" : "color:var(--danger)"}">${s.is_correct ? "정답" : "오답"}</td>
      <td>${s.username ?? "알 수 없음"}</td>
      <td style="color:var(--text-muted); font-size:13px;">${SUBJECTS[s.subject]?.label ?? "-"}</td>
      <td>${s.problem_title ?? "(삭제된 문제)"}</td>
      <td style="color:var(--text-faint); font-size:12px; font-family:var(--font-mono);">${new Date(s.submitted_at).toLocaleString("ko-KR")}</td>
    </tr>
  `).join("");
}

document.getElementById("sub-search").addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  currentUsername = e.target.value.trim();
  loadSubmissions();
});

(async function init() {
  await renderNav("submissions");
  renderTabs();
  loadSubmissions();
})();
</script>
</body>
</html>
