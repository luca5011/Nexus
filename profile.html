<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프로필 · Nexus</title>
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.dataset.theme = localStorage.getItem("nexus-theme") || "dark";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
<div id="nav-root"></div>

<main class="page" style="padding-top:0;">
  <div id="profile-banner" class="profile-banner"></div>
  <div id="profile-header" class="profile-header"></div>

  <div id="avatar-edit" style="display:none; margin-bottom:20px;" class="card">
    <div class="field">
      <label>프로필 사진 URL 변경</label>
      <div style="display:flex; gap:8px;">
        <input id="avatar-url-input" type="text" placeholder="https://... 이미지 주소">
        <button id="avatar-save-btn" class="btn btn--primary" style="white-space:nowrap;">저장</button>
      </div>
    </div>
    <div id="avatar-msg" class="form-msg"></div>
  </div>

  <div id="stat-grid" class="stat-grid"></div>

  <h2 style="margin-top:32px;">과목별 티어</h2>
  <div id="tier-grid" class="tier-grid"></div>

  <h2 style="margin-top:32px;">보유 칭호</h2>
  <div id="titles-list" style="display:flex; flex-wrap:wrap; gap:8px;"></div>

  <div id="inventory-section" style="display:none;">
    <h2 style="margin-top:32px;">보유 배경 &amp; 테마</h2>
    <div id="inventory-list" class="shop-grid"></div>
  </div>
</main>

<script src="js/supabase-client.js"></script>
<script src="js/tier.js"></script>
<script src="js/nav.js"></script>
<script>
async function loadProfile() {
  await renderNav("profile");

  const { data: { user: authUser } } = await sb.auth.getUser();
  const params = new URLSearchParams(window.location.search);
  const targetId = params.get("id") || authUser?.id;

  if (!targetId) {
    window.location.href = "login.html";
    return;
  }

  const isOwnProfile = !!authUser && authUser.id === targetId;

  const { data: profile } = await sb
    .from("profiles")
    .select("username, avatar_url, coin_balance, equipped_title_id, equipped_background_id")
    .eq("id", targetId)
    .single();

  if (!profile) {
    document.getElementById("profile-header").innerHTML = `<p style="color:var(--text-muted);">유저를 찾을 수 없어요.</p>`;
    return;
  }

  let equippedTitleName = "";
  if (profile.equipped_title_id) {
    const { data: t } = await sb.from("titles").select("name").eq("id", profile.equipped_title_id).single();
    equippedTitleName = t?.name ?? "";
  }

  const bannerEl = document.getElementById("profile-banner");
  if (profile.equipped_background_id) {
    const { data: bg } = await sb.from("shop_items").select("image_url").eq("id", profile.equipped_background_id).single();
    if (bg?.image_url) {
      bannerEl.style.backgroundImage = `url(${bg.image_url})`;
    }
  }

  document.getElementById("profile-header").innerHTML = `
    <img class="profile-avatar" src="${(profile.avatar_url && /^https?:\/\//i.test(profile.avatar_url)) ? escapeHtml(profile.avatar_url) : "https://api.dicebear.com/7.x/shapes/svg?seed=" + encodeURIComponent(profile.username || "")}">
    <div>
      <div class="profile-username">${escapeHtml(profile.username)}</div>
      ${equippedTitleName ? `<div class="profile-title">${escapeHtml(equippedTitleName)}</div>` : ""}
    </div>
  `;

  const { data: tiers } = await sb
    .from("user_tiers")
    .select("subject, rating, solved_count")
    .eq("user_id", targetId);

  const totalSolved = (tiers ?? []).reduce((sum, t) => sum + t.solved_count, 0);

  document.getElementById("stat-grid").innerHTML = `
    <div class="stat-box"><div class="num">${totalSolved}</div><div class="label">총 푼 문제</div></div>
    <div class="stat-box"><div class="num">🪙 ${profile.coin_balance ?? 0}</div><div class="label">보유 코인</div></div>
  `;

  document.getElementById("tier-grid").innerHTML = SUBJECT_ORDER.filter(s => !SUBJECTS[s].disabled).map(subjectKey => {
    const row = tiers?.find(t => t.subject === subjectKey);
    const rating = row?.rating ?? 0;
    const display = ratingToTierDisplay(rating);
    return `
      <div class="tier-card">
        <div class="tier-card__subject">${SUBJECTS[subjectKey].icon} ${SUBJECTS[subjectKey].label} · ${row?.solved_count ?? 0}문제</div>
        <span class="tier-badge tier-badge--lg" style="--tier-color:${display.color}">
          <span class="tier-badge__hex"></span>${display.label}
        </span>
        <div class="tier-card__bar"><div class="tier-card__bar-fill" style="width:${display.progressPct}%; --tier-color:${display.color}"></div></div>
        <div class="tier-card__remaining">${display.isMax ? "최고 티어 달성" : `다음 승급까지 레이팅 ${Math.ceil(display.remaining)} 남음`}</div>
      </div>
    `;
  }).join("");

  const { data: userTitles } = await sb
    .from("user_titles")
    .select("titles(id, name)")
    .eq("user_id", targetId);

  const titlesEl = document.getElementById("titles-list");
  if (!userTitles || userTitles.length === 0) {
    titlesEl.innerHTML = `<div class="empty-state" style="padding:24px;">아직 획득한 칭호가 없어요.</div>`;
  } else {
    titlesEl.innerHTML = userTitles.map(ut => `
      <button class="btn ${isOwnProfile ? "btn--ghost" : "btn--ghost"}" data-title-id="${ut.titles.id}" style="font-size:13px; ${isOwnProfile ? "" : "cursor:default;"}">${escapeHtml(ut.titles.name)}</button>
    `).join("");

    if (isOwnProfile) {
      titlesEl.querySelectorAll("button").forEach(btn => {
        btn.addEventListener("click", async () => {
          await sb.from("profiles").update({ equipped_title_id: btn.dataset.titleId }).eq("id", targetId);
          loadProfile();
        });
      });
    }
  }

  // 본인 프로필일 때만: 아바타 변경 + 보유 배경/테마 장착
  if (isOwnProfile) {
    const avatarEditEl = document.getElementById("avatar-edit");
    avatarEditEl.style.display = "block";
    const avatarInput = document.getElementById("avatar-url-input");
    avatarInput.value = profile.avatar_url ?? "";

    document.getElementById("avatar-save-btn").addEventListener("click", async () => {
      const msg = document.getElementById("avatar-msg");
      const newUrl = avatarInput.value.trim();
      const { error } = await sb.from("profiles").update({ avatar_url: newUrl }).eq("id", targetId);
      msg.textContent = error ? error.message : "프로필 사진을 변경했어요.";
      msg.className = "form-msg " + (error ? "form-msg--error" : "form-msg--success");
      if (!error) loadProfile();
    });

    const invSectionEl = document.getElementById("inventory-section");
    const invListEl = document.getElementById("inventory-list");

    const { data: inventory } = await sb
      .from("user_inventory")
      .select("shop_items(id, name, type, image_url)")
      .eq("user_id", targetId);

    if (inventory && inventory.length > 0) {
      invSectionEl.style.display = "block";
      invListEl.innerHTML = inventory.map(inv => {
        const item = inv.shop_items;
        const isEquipped = item.type === "background"
          ? profile.equipped_background_id === item.id
          : profile.equipped_theme_id === item.id;
        return `
          <div class="shop-item">
            <div class="shop-item__preview" style="${item.image_url ? `background-image:url(${escapeHtml(item.image_url)}); background-size:cover;` : ""}"></div>
            <strong>${escapeHtml(item.name)}</strong>
            <span style="font-size:12px; color:var(--text-muted);">${item.type === "background" ? "프로필 배경" : "테마"}</span>
            <button class="btn ${isEquipped ? "btn--ghost" : "btn--primary"}" data-item-id="${item.id}" data-item-type="${item.type}" ${isEquipped ? "disabled" : ""}>
              ${isEquipped ? "장착중" : "장착하기"}
            </button>
          </div>
        `;
      }).join("");

      invListEl.querySelectorAll("button[data-item-id]").forEach(btn => {
        btn.addEventListener("click", async () => {
          const field = btn.dataset.itemType === "background" ? "equipped_background_id" : "equipped_theme_id";
          await sb.from("profiles").update({ [field]: btn.dataset.itemId }).eq("id", targetId);
          loadProfile();
        });
      });
    }
  }
}

loadProfile();
</script>
</body>
</html>
