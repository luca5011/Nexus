<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 · Nexus</title>
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.dataset.theme = localStorage.getItem("nexus-theme") || "dark";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="nav-root"></div>

<main class="page" style="padding-top:32px;">
  <h1>관리자</h1>
  <div id="guard-msg"></div>

  <div id="admin-body" style="display:none;">

    <section class="admin-section">
      <h2>문제 추가</h2>
      <form id="problem-form" class="card">
        <div class="field">
          <label>과목</label>
          <select id="p-subject">
            <option value="coding">코딩 (향후 개설 · UI 비활성)</option>
            <option value="math" selected>수학</option>
            <option value="science">과학</option>
            <option value="korean">국어</option>
          </select>
        </div>
        <div class="field">
          <label>티어 레벨 (0=Origin III ~ 14=Transcendent I)</label>
          <input id="p-tier" type="number" min="0" max="14" value="0">
        </div>
        <div class="field"><label>제목</label><input id="p-title" type="text" required></div>
        <div class="field"><label>문제 내용</label><textarea id="p-content" rows="5" required></textarea></div>
        <div class="field">
          <label>답 유형</label>
          <select id="p-answer-type">
            <option value="objective">객관식</option>
            <option value="subjective">주관식</option>
          </select>
        </div>

        <div id="objective-fields">
          <div class="field"><label>보기 (한 줄에 하나씩)</label><textarea id="p-choices" rows="4" placeholder="보기1&#10;보기2&#10;보기3&#10;보기4"></textarea></div>
          <div class="field"><label>정답 보기 번호 (1부터 시작)</label><input id="p-correct-index" type="number" min="1" value="1"></div>
        </div>
        <div id="subjective-fields" style="display:none;">
          <div class="field"><label>정답 (대소문자/공백 무시하고 비교돼요)</label><input id="p-correct-text" type="text"></div>
        </div>

        <button type="submit" class="btn btn--primary">문제 등록</button>
        <div id="problem-msg" class="form-msg"></div>
      </form>
    </section>

    <section class="admin-section">
      <h2>개발자노트 작성</h2>
      <form id="note-form" class="card">
        <div class="field"><label>제목</label><input id="n-title" type="text" required></div>
        <div class="field"><label>내용</label><textarea id="n-content" rows="4" required></textarea></div>
        <button type="submit" class="btn btn--primary">게시</button>
        <div id="note-msg" class="form-msg"></div>
      </form>
    </section>

    <section class="admin-section">
      <h2>칭호 추가</h2>
      <form id="title-form" class="card">
        <div class="field">
          <label>획득 방식</label>
          <select id="t-type">
            <option value="auto_tier">자동 - 티어 승급</option>
            <option value="auto_solved_count">자동 - 누적 풀이수</option>
            <option value="purchase">구매형</option>
            <option value="manual">기타 (조건 직접 입력, 관리자가 수동 지급)</option>
          </select>
        </div>
        <div class="field"><label>칭호 이름</label><input id="t-name" type="text" required></div>

        <div id="t-tier-fields">
          <div class="field">
            <label>과목</label>
            <select id="t-subject">
              <option value="math">수학</option>
              <option value="science">과학</option>
              <option value="korean">국어</option>
              <option value="coding">코딩</option>
            </select>
          </div>
          <div class="field"><label>티어 레벨 (0~14)</label><input id="t-tier-level" type="number" min="0" max="14" value="0"></div>
        </div>
        <div id="t-count-fields" style="display:none;">
          <div class="field"><label>누적 풀이수 기준</label><input id="t-count" type="number" min="1"></div>
        </div>
        <div id="t-price-fields" style="display:none;">
          <div class="field"><label>가격 (코인)</label><input id="t-price" type="number" min="1"></div>
        </div>
        <div id="t-manual-fields" style="display:none;">
          <div class="field">
            <label>취득 조건 (자유 입력, 자동 지급 안 되고 참고용 설명이에요)</label>
            <input id="t-condition" type="text" placeholder="예: 대회 1등 수상, 이벤트 참여 등">
          </div>
        </div>

        <button type="submit" class="btn btn--primary">칭호 추가</button>
        <div id="title-msg" class="form-msg"></div>
      </form>
    </section>

    <section class="admin-section">
  <h2>상점 아이템 추가</h2>
  <form id="shop-item-form" class="card">
    <div class="field">
      <label>종류</label>
      <select id="s-type">
        <option value="background">프로필 배경</option>
        <option value="theme">테마</option>
      </select>
    </div>
    <div class="field"><label>이름</label><input id="s-name" type="text" required></div>
    <div class="field"><label>설명 (선택)</label><input id="s-description" type="text"></div>
    <div class="field"><label>가격 (코인)</label><input id="s-price" type="number" min="1" required></div>
    <div class="field">
      <label>이미지 URL (배경 미리보기/배너에 사용돼요)</label>
      <input id="s-image-url" type="text" placeholder="https://...">
    </div>

    <button type="submit" class="btn btn--primary">아이템 추가</button>
    <div id="shop-item-msg" class="form-msg"></div>
  </form>
</section>

    <section class="admin-section">
      <h2>계정 관리</h2>
      <div class="card">
        <div class="field">
          <label>아이디로 검색</label>
          <input id="user-search" type="text" placeholder="username 입력 후 Enter">
        </div>
        <div id="user-search-result"></div>
      </div>
    </section>

    <section class="admin-section">
      <h2>유저에게 지급하기</h2>
      <div class="card">
        <div class="field">
          <label>아이디로 검색</label>
          <input id="grant-user-search" type="text" placeholder="username 입력 후 Enter">
        </div>
        <div id="grant-user-info" style="color:var(--text-muted); font-size:13px; margin-bottom:12px;"></div>

        <div class="field">
          <label>지급할 배경/테마</label>
          <select id="grant-item-select"><option value="">-- 상점 아이템 목록 불러오는 중 --</option></select>
        </div>
        <button type="button" id="grant-item-btn" class="btn btn--primary" disabled>아이템 지급</button>

        <div class="field" style="margin-top:20px;">
          <label>지급할 칭호</label>
          <select id="grant-title-select"><option value="">-- 칭호 목록 불러오는 중 --</option></select>
        </div>
        <button type="button" id="grant-title-btn" class="btn btn--primary" disabled>칭호 지급</button>

        <div id="grant-msg" class="form-msg"></div>
      </div>
    </section>

    <section class="admin-section">
      <h2>제출 기록</h2>
      <div class="card">
        <div class="field">
          <label>아이디로 필터 (비우면 전체 최근 100개)</label>
          <input id="sub-search" type="text" placeholder="username 입력 후 Enter">
        </div>
      </div>
      <div class="card" style="padding:0; overflow:hidden; margin-top:12px;">
        <table class="problem-table">
          <thead>
            <tr>
              <th>결과</th><th>유저</th><th>과목</th><th>문제</th><th>제출 내용</th><th>시각</th>
            </tr>
          </thead>
          <tbody id="submissions-rows"></tbody>
        </table>
        <div id="submissions-empty" class="empty-state" style="display:none;">제출 기록이 없어요.</div>
      </div>
    </section>

  </div>
</main>

<script src="js/supabase-client.js"></script>
<script src="js/tier.js"></script>
<script src="js/nav.js"></script>
<script>
async function init() {
  await renderNav("admin");
  const user = await requireAuth();
  if (!user) return;

  const { data: profile } = await sb.from("profiles").select("is_admin").eq("id", user.id).single();
  if (!profile?.is_admin) {
    document.getElementById("guard-msg").innerHTML = `<p style="color:var(--danger)">관리자 계정만 접근할 수 있어요.</p>`;
    return;
  }
  document.getElementById("admin-body").style.display = "block";

  // 답 유형 전환
  document.getElementById("p-answer-type").addEventListener("change", (e) => {
    const isObjective = e.target.value === "objective";
    document.getElementById("objective-fields").style.display = isObjective ? "block" : "none";
    document.getElementById("subjective-fields").style.display = isObjective ? "none" : "block";
  });

  // 칭호 유형 전환
  document.getElementById("t-type").addEventListener("change", (e) => {
    const v = e.target.value;
    document.getElementById("t-tier-fields").style.display = v === "auto_tier" ? "block" : "none";
    document.getElementById("t-count-fields").style.display = v === "auto_solved_count" ? "block" : "none";
    document.getElementById("t-price-fields").style.display = v === "purchase" ? "block" : "none";
    document.getElementById("t-manual-fields").style.display = v === "manual" ? "block" : "none";
  });

  // 문제 등록
  document.getElementById("problem-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("problem-msg");
    msg.textContent = ""; msg.className = "form-msg";

    const subject = document.getElementById("p-subject").value;
    const tier_level = parseInt(document.getElementById("p-tier").value, 10);
    const title = document.getElementById("p-title").value.trim();
    const content = document.getElementById("p-content").value.trim();
    const answer_type = document.getElementById("p-answer-type").value;

    const { data: problem, error: pErr } = await sb
      .from("problems")
      .insert({ subject, tier_level, title, content, answer_type, created_by: user.id })
      .select()
      .single();

    if (pErr) { msg.textContent = pErr.message; msg.classList.add("form-msg--error"); return; }

    if (answer_type === "objective") {
      const lines = document.getElementById("p-choices").value.split("\n").map(s => s.trim()).filter(Boolean);
      const correctIndex = parseInt(document.getElementById("p-correct-index").value, 10) - 1;

      const choiceRows = lines.map((text, i) => ({ problem_id: problem.id, choice_order: i, choice_text: text }));
      const { data: insertedChoices, error: cErr } = await sb.from("problem_choices").insert(choiceRows).select();
      if (cErr) { msg.textContent = cErr.message; msg.classList.add("form-msg--error"); return; }

      const correctChoice = insertedChoices.find(c => c.choice_order === correctIndex);
      await sb.from("problem_answers").insert({ problem_id: problem.id, correct_answer: correctChoice?.id ?? "" });
    } else {
      const correctText = document.getElementById("p-correct-text").value.trim();
      await sb.from("problem_answers").insert({ problem_id: problem.id, correct_answer: correctText });
    }

    msg.textContent = "문제가 등록됐어요.";
    msg.classList.add("form-msg--success");
    e.target.reset();
  });

  // 개발자노트
  document.getElementById("note-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("note-msg");
    const title = document.getElementById("n-title").value.trim();
    const content = document.getElementById("n-content").value.trim();

    const { error } = await sb.from("dev_notes").insert({ title, content, created_by: user.id });
    msg.textContent = error ? error.message : "게시했어요.";
    msg.className = "form-msg " + (error ? "form-msg--error" : "form-msg--success");
    if (!error) e.target.reset();
  });

  // 칭호 추가
  document.getElementById("title-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("title-msg");
    const acquire_type = document.getElementById("t-type").value;
    const name = document.getElementById("t-name").value.trim();

    const row = { name, acquire_type };
    if (acquire_type === "auto_tier") {
      row.subject = document.getElementById("t-subject").value;
      row.tier_level = parseInt(document.getElementById("t-tier-level").value, 10);
    } else if (acquire_type === "auto_solved_count") {
      row.solved_count_threshold = parseInt(document.getElementById("t-count").value, 10);
    } else if (acquire_type === "purchase") {
      row.price = parseInt(document.getElementById("t-price").value, 10);
    } else {
      row.condition_description = document.getElementById("t-condition").value.trim();
    }

    const { error } = await sb.from("titles").insert(row);
    msg.textContent = error ? error.message : "칭호를 추가했어요.";
    msg.className = "form-msg " + (error ? "form-msg--error" : "form-msg--success");
    if (!error) e.target.reset();
  });

  // 유저 검색 / 밴
  document.getElementById("user-search").addEventListener("keydown", async (e) => {
    if (e.key !== "Enter") return;
    const username = e.target.value.trim();
    const resultEl = document.getElementById("user-search-result");
    resultEl.innerHTML = "검색 중...";

    const { data: found, error } = await sb
      .from("profiles")
      .select("id, username, is_banned, is_admin")
      .ilike("username", username)
      .limit(5);

    if (error || !found || found.length === 0) {
      resultEl.innerHTML = `<p style="color:var(--text-faint);">사용자를 찾을 수 없어요.</p>`;
      return;
    }

    resultEl.innerHTML = found.map(u => `
      <div style="display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border);">
        <span style="flex:1;">${u.username} ${u.is_banned ? '<span style="color:var(--danger)">(밴됨)</span>' : ""}</span>
        <button class="btn ${u.is_banned ? "btn--ghost" : "btn--danger"}" data-id="${u.id}" data-ban="${!u.is_banned}">
          ${u.is_banned ? "밴 해제" : "밴"}
        </button>
      </div>
    `).join("");

    resultEl.querySelectorAll("button[data-ban]").forEach(btn => {
      btn.addEventListener("click", async () => {
        const isBanned = btn.dataset.ban === "true";
        await sb.from("profiles").update({ is_banned: isBanned }).eq("id", btn.dataset.id);
        document.getElementById("user-search").dispatchEvent(new KeyboardEvent("keydown", { key: "Enter" }));
      });
    });
  });

  // 유저에게 지급하기
  let grantTargetUserId = null;

  const { data: shopItemsForGrant } = await sb.from("shop_items").select("id, name, type").order("name");
  const itemSelect = document.getElementById("grant-item-select");
  itemSelect.innerHTML = shopItemsForGrant && shopItemsForGrant.length > 0
    ? shopItemsForGrant.map(i => `<option value="${i.id}">${i.name} (${i.type === "background" ? "배경" : "테마"})</option>`).join("")
    : `<option value="">등록된 아이템이 없어요</option>`;

  const { data: titlesForGrant } = await sb.from("titles").select("id, name").order("name");
  const titleSelect = document.getElementById("grant-title-select");
  titleSelect.innerHTML = titlesForGrant && titlesForGrant.length > 0
    ? titlesForGrant.map(t => `<option value="${t.id}">${t.name}</option>`).join("")
    : `<option value="">등록된 칭호가 없어요</option>`;

  document.getElementById("grant-user-search").addEventListener("keydown", async (e) => {
    if (e.key !== "Enter") return;
    const username = e.target.value.trim();
    const infoEl = document.getElementById("grant-user-info");
    const itemBtn = document.getElementById("grant-item-btn");
    const titleBtn = document.getElementById("grant-title-btn");

    const { data: found } = await sb.from("profiles").select("id, username").ilike("username", username).limit(1).single();

    if (!found) {
      infoEl.textContent = "사용자를 찾을 수 없어요.";
      grantTargetUserId = null;
      itemBtn.disabled = true;
      titleBtn.disabled = true;
      return;
    }

    grantTargetUserId = found.id;
    infoEl.textContent = `대상: ${found.username}`;
    itemBtn.disabled = false;
    titleBtn.disabled = false;
  });

  document.getElementById("grant-item-btn").addEventListener("click", async () => {
    const msg = document.getElementById("grant-msg");
    const itemId = itemSelect.value;
    if (!grantTargetUserId || !itemId) return;

    const { error } = await sb.from("user_inventory")
      .upsert({ user_id: grantTargetUserId, item_id: itemId }, { onConflict: "user_id,item_id", ignoreDuplicates: true });
    msg.textContent = error ? error.message : "아이템을 지급했어요.";
    msg.className = "form-msg " + (error ? "form-msg--error" : "form-msg--success");
  });

  document.getElementById("grant-title-btn").addEventListener("click", async () => {
    const msg = document.getElementById("grant-msg");
    const titleId = titleSelect.value;
    if (!grantTargetUserId || !titleId) return;

    const { error } = await sb.from("user_titles")
      .upsert({ user_id: grantTargetUserId, title_id: titleId }, { onConflict: "user_id,title_id", ignoreDuplicates: true });
    msg.textContent = error ? error.message : "칭호를 지급했어요.";
    msg.className = "form-msg " + (error ? "form-msg--error" : "form-msg--success");
  });

  // 제출 기록
  async function loadSubmissions(username) {
    const rowsEl = document.getElementById("submissions-rows");
    const emptyEl = document.getElementById("submissions-empty");
    rowsEl.innerHTML = "";

    let targetUserId = null;
    if (username) {
      const { data: u } = await sb.from("profiles").select("id").ilike("username", username).limit(1).single();
      if (!u) {
        emptyEl.style.display = "block";
        emptyEl.textContent = "해당 아이디의 유저를 찾을 수 없어요.";
        return;
      }
      targetUserId = u.id;
      emptyEl.textContent = "제출 기록이 없어요.";
    }

    let query = sb
      .from("submissions")
      .select("submitted_answer, is_correct, submitted_at, profiles(username), problems(title, subject)")
      .order("submitted_at", { ascending: false })
      .limit(100);

    if (targetUserId) query = query.eq("user_id", targetUserId);

    const { data: subs, error } = await query;

    if (error || !subs || subs.length === 0) {
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    rowsEl.innerHTML = subs.map(s => `
      <tr>
        <td class="${s.is_correct ? "problem-row-solved" : ""}" style="${s.is_correct ? "" : "color:var(--danger)"}">${s.is_correct ? "정답" : "오답"}</td>
        <td>${s.profiles?.username ?? "알 수 없음"}</td>
        <td style="color:var(--text-muted); font-size:13px;">${SUBJECTS[s.problems?.subject]?.label ?? "-"}</td>
        <td>${s.problems?.title ?? "(삭제된 문제)"}</td>
        <td style="color:var(--text-muted); font-size:13px; max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${s.submitted_answer}</td>
        <td style="color:var(--text-faint); font-size:12px; font-family:var(--font-mono);">${new Date(s.submitted_at).toLocaleString("ko-KR")}</td>
      </tr>
    `).join("");
  }

  document.getElementById("sub-search").addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    loadSubmissions(e.target.value.trim());
  });

  loadSubmissions(null);
}

init();
</script>
</body>
</html>
