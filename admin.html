<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 · Nexus</title>
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.dataset.theme = localStorage.getItem("nexus-theme") || "dark";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  .admin-menu-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }
  @media (max-width: 640px) {
    .admin-menu-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div id="nav-root"></div>

<main class="page" style="padding-top:32px;">
  <h1>관리자</h1>
  <div id="guard-msg"></div>

  <div id="admin-body" style="display:none;">
    <div class="admin-menu-grid">
      <a class="card" href="admin-problems.html" style="text-decoration:none;">
        <strong>문제 관리</strong>
        <p style="font-size:13px; margin-top:8px;">문제 추가/수정, 문제 목록 확인</p>
      </a>
      <a class="card" href="admin-problemsets.html" style="text-decoration:none;">
        <strong>문제집 관리</strong>
        <p style="font-size:13px; margin-top:8px;">문제집 생성 및 문제 구성</p>
      </a>
      <a class="card" href="admin-devnotes.html" style="text-decoration:none;">
        <strong>개발자노트 작성</strong>
        <p style="font-size:13px; margin-top:8px;">업데이트 소식 게시</p>
      </a>
      <a class="card" href="admin-titles.html" style="text-decoration:none;">
        <strong>칭호 관리</strong>
        <p style="font-size:13px; margin-top:8px;">자동/구매/수동 칭호 추가</p>
      </a>
      <a class="card" href="admin-shop.html" style="text-decoration:none;">
        <strong>상점 아이템 추가</strong>
        <p style="font-size:13px; margin-top:8px;">배경/테마 아이템 등록</p>
      </a>
      <a class="card" href="admin-users.html" style="text-decoration:none;">
        <strong>계정 관리</strong>
        <p style="font-size:13px; margin-top:8px;">아이디 검색, 밴/밴 해제</p>
      </a>
      <a class="card" href="admin-grants.html" style="text-decoration:none;">
        <strong>유저에게 지급하기</strong>
        <p style="font-size:13px; margin-top:8px;">아이템/칭호 수동 지급</p>
      </a>
      <a class="card" href="admin-submissions.html" style="text-decoration:none;">
        <strong>제출 기록</strong>
        <p style="font-size:13px; margin-top:8px;">전체/유저별 제출 내역 조회</p>
      </a>
      <a class="card" href="admin-code-problems.html" style="text-decoration:none;">
        <strong>코딩 문제 관리</strong>
        <p style="font-size:13px; margin-top:8px;">총관리자 전용 페이지</p>
      </a>
    </div>
  </div>
</main>

<script src="js/supabase-client.js"></script>
<script src="js/tier.js"></script>
<script src="js/nav.js"></script>
<script>
async function init() {
  await renderNav("admin");
  const user = await requireAuth();
  if (!user) return;

  const { data: profile } = await sb.from("profiles").select("is_admin, is_super_admin").eq("id", user.id).single();
  if (!profile?.is_admin && !profile?.is_super_admin) {
    document.getElementById("guard-msg").innerHTML = `<p style="color:var(--danger)">관리자 계정만 접근할 수 있어요.</p>`;
    return;
  }
  document.getElementById("admin-body").style.display = "block";
}
init();
</script>
</body>
</html>
