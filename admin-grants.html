<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>유저에게 지급하기 · Nexus</title>
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.dataset.theme = localStorage.getItem("nexus-theme") || "dark";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
<div id="nav-root"></div>

<main class="page" style="padding-top:32px; max-width:640px;">
  <a href="admin.html" class="btn btn--ghost" style="font-size:13px; padding:6px 10px; margin-bottom:12px;">← 관리자 메뉴</a>
  <h1>유저에게 지급하기</h1>
  <div id="guard-msg"></div>

  <div id="admin-body" style="display:none;">
    <section class="admin-section">
      <div class="card">
        <div class="field">
          <label>아이디로 검색</label>
          <input id="grant-user-search" type="text" placeholder="username 입력 후 Enter">
        </div>
        <div id="grant-user-info" style="color:var(--text-muted); font-size:13px; margin-bottom:12px;"></div>

        <div class="field">
          <label>지급할 배경/테마</label>
          <select id="grant-item-select"><option value="">-- 상점 아이템 목록 불러오는 중 --</option></select>
        </div>
        <button type="button" id="grant-item-btn" class="btn btn--primary" disabled>아이템 지급</button>

        <div class="field" style="margin-top:20px;">
          <label>지급할 칭호</label>
          <select id="grant-title-select"><option value="">-- 칭호 목록 불러오는 중 --</option></select>
        </div>
        <button type="button" id="grant-title-btn" class="btn btn--primary" disabled>칭호 지급</button>

        <div id="grant-msg" class="form-msg"></div>
      </div>
    </section>
  </div>
</main>

<script src="js/supabase-client.js"></script>
<script src="js/tier.js"></script>
<script src="js/nav.js"></script>
<script>
async function init() {
  await renderNav("admin");
  const user = await requireAuth();
  if (!user) return;

  const { data: profile } = await sb.from("profiles").select("is_admin, is_super_admin").eq("id", user.id).single();
  if (!profile?.is_admin && !profile?.is_super_admin) {
    document.getElementById("guard-msg").innerHTML = `<p style="color:var(--danger)">관리자 계정만 접근할 수 있어요.</p>`;
    return;
  }
  document.getElementById("admin-body").style.display = "block";

  let grantTargetUserId = null;

  const { data: shopItemsForGrant } = await sb.from("shop_items").select("id, name, type").order("name");
  const itemSelect = document.getElementById("grant-item-select");
  itemSelect.innerHTML = shopItemsForGrant && shopItemsForGrant.length > 0
    ? shopItemsForGrant.map(i => `<option value="${i.id}">${i.name} (${i.type === "background" ? "배경" : "테마"})</option>`).join("")
    : `<option value="">등록된 아이템이 없어요</option>`;

  const { data: titlesForGrant } = await sb.from("titles").select("id, name").order("name");
  const titleSelect = document.getElementById("grant-title-select");
  titleSelect.innerHTML = titlesForGrant && titlesForGrant.length > 0
    ? titlesForGrant.map(t => `<option value="${t.id}">${t.name}</option>`).join("")
    : `<option value="">등록된 칭호가 없어요</option>`;

  document.getElementById("grant-user-search").addEventListener("keydown", async (e) => {
    if (e.key !== "Enter") return;
    const username = e.target.value.trim();
    const infoEl = document.getElementById("grant-user-info");
    const itemBtn = document.getElementById("grant-item-btn");
    const titleBtn = document.getElementById("grant-title-btn");

    const { data: found } = await sb.from("profiles").select("id, username").ilike("username", username).limit(1).single();

    if (!found) {
      infoEl.textContent = "사용자를 찾을 수 없어요.";
      grantTargetUserId = null;
      itemBtn.disabled = true;
      titleBtn.disabled = true;
      return;
    }

    grantTargetUserId = found.id;
    infoEl.textContent = `대상: ${found.username}`;
    itemBtn.disabled = false;
    titleBtn.disabled = false;
  });

  document.getElementById("grant-item-btn").addEventListener("click", async () => {
    const msg = document.getElementById("grant-msg");
    const itemId = itemSelect.value;
    if (!grantTargetUserId || !itemId) return;

    const { error } = await sb.from("user_inventory")
      .upsert({ user_id: grantTargetUserId, item_id: itemId }, { onConflict: "user_id,item_id", ignoreDuplicates: true });
    msg.textContent = error ? error.message : "아이템을 지급했어요.";
    msg.className = "form-msg " + (error ? "form-msg--error" : "form-msg--success");
  });

  document.getElementById("grant-title-btn").addEventListener("click", async () => {
    const msg = document.getElementById("grant-msg");
    const titleId = titleSelect.value;
    if (!grantTargetUserId || !titleId) return;

    const { error } = await sb.from("user_titles")
      .upsert({ user_id: grantTargetUserId, title_id: titleId }, { onConflict: "user_id,title_id", ignoreDuplicates: true });
    msg.textContent = error ? error.message : "칭호를 지급했어요.";
    msg.className = "form-msg " + (error ? "form-msg--error" : "form-msg--success");
  });
}
init();
</script>
</body>
</html>
