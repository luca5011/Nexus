<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>총관리자 · Nexus</title>
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.dataset.theme = localStorage.getItem("nexus-theme") || "dark";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  .admin-menu-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }
  @media (max-width: 640px) {
    .admin-menu-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div id="nav-root"></div>

<main class="page" style="padding-top:32px;">
  <h1>총관리자</h1>
  <div id="guard-msg"></div>

  <div id="super-admin-body" style="display:none;">
    <div class="admin-menu-grid">
      <a class="card" href="superadmin-contests.html" style="text-decoration:none;">
        <strong>대회 관리</strong>
        <p style="font-size:13px; margin-top:8px;">대회 개최, 목록 확인 및 삭제</p>
      </a>
      <a class="card" href="superadmin-contest-problems.html" style="text-decoration:none;">
        <strong>대회 문제 출제</strong>
        <p style="font-size:13px; margin-top:8px;">대회별 문제 등록 및 목록 관리</p>
      </a>
      <a class="card" href="superadmin-code-problems.html" style="text-decoration:none;">
        <strong>코딩 문제 관리</strong>
        <p style="font-size:13px; margin-top:8px;">Judge0 채점용 문제/테스트케이스 등록 및 관리</p>
      </a>
    </div>
  </div>
</main>

<script src="js/supabase-client.js"></script>
<script src="js/tier.js"></script>
<script src="js/nav.js"></script>
<script>
async function init() {
  await renderNav("superadmin");
  const user = await requireAuth();
  if (!user) return;

  const { data: profile } = await sb.from("profiles").select("is_super_admin").eq("id", user.id).single();
  if (!profile?.is_super_admin) {
    document.getElementById("guard-msg").innerHTML = `<p style="color:var(--danger)">총관리자 계정만 접근할 수 있어요.</p>`;
    return;
  }
  document.getElementById("super-admin-body").style.display = "block";
}
init();
</script>
</body>
</html>
