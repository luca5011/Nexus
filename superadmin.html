<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>총관리자 · Nexus</title>
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.dataset.theme = localStorage.getItem("nexus-theme") || "dark";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="nav-root"></div>

<main class="page" style="padding-top:32px;">
  <h1>총관리자</h1>
  <div id="guard-msg"></div>

  <div id="super-admin-body" style="display:none;">

    <section class="admin-section">
      <h2>대회 개최</h2>
      <form id="contest-form" class="card">
        <div class="field"><label>대회 이름</label><input id="c-title" type="text" required></div>
        <div class="field"><label>설명 (선택)</label><textarea id="c-description" rows="3"></textarea></div>
        <div class="field"><label>시작 시각</label><input id="c-starts" type="datetime-local" required></div>
        <div class="field"><label>종료 시각</label><input id="c-ends" type="datetime-local" required></div>
        <button type="submit" class="btn btn--primary">대회 만들기</button>
        <div id="contest-msg" class="form-msg"></div>
      </form>

      <div id="contests-admin-list" style="margin-top:16px; display:flex; flex-direction:column; gap:10px;"></div>
    </section>

    <section class="admin-section">
      <h2>대회 문제 출제</h2>
      <form id="contest-problem-form" class="card">
        <div class="field">
          <label>대회 선택</label>
          <select id="cp-contest" required></select>
        </div>
        <div class="field">
          <label>과목</label>
          <select id="cp-subject">
            <option value="coding">코딩 (향후 개설 · UI 비활성)</option>
            <option value="math" selected>수학</option>
            <option value="science">과학</option>
            <option value="korean">국어</option>
          </select>
        </div>
        <div class="field">
          <label>티어 레벨 (0=Origin III ~ 17=Omniscient I, 대회 종료 전까지는 안 보여요)</label>
          <input id="cp-tier" type="number" min="0" max="17" value="0">
        </div>
        <div class="field"><label>제목</label><input id="cp-title" type="text" required></div>
        <div class="field"><label>문제 내용</label><textarea id="cp-content" rows="5" required></textarea></div>
        <div class="field">
          <label>답 유형</label>
          <select id="cp-answer-type">
            <option value="objective">객관식</option>
            <option value="subjective">주관식</option>
          </select>
        </div>

        <div id="cp-objective-fields">
          <div class="field"><label>보기 (한 줄에 하나씩)</label><textarea id="cp-choices" rows="4" placeholder="보기1&#10;보기2&#10;보기3&#10;보기4"></textarea></div>
          <div class="field"><label>정답 보기 번호 (1부터 시작)</label><input id="cp-correct-index" type="number" min="1" value="1"></div>
        </div>
        <div id="cp-subjective-fields" style="display:none;">
          <div class="field"><label>정답 (대소문자/공백 무시)</label><input id="cp-correct-text" type="text"></div>
        </div>

        <button type="submit" class="btn btn--primary">대회 문제 등록</button>
        <div id="contest-problem-msg" class="form-msg"></div>
      </form>
    </section>

    <section class="admin-section">
      <h2>대회별 문제 목록</h2>
      <div class="card">
        <div class="field">
          <label>대회 선택</label>
          <select id="cpl-contest-filter"></select>
        </div>
      </div>
      <div class="card" style="padding:0; overflow:hidden; margin-top:12px;">
        <table class="problem-table">
          <thead><tr><th>과목</th><th>티어</th><th>제목</th><th style="width:70px;"></th></tr></thead>
          <tbody id="contest-problem-rows"></tbody>
        </table>
        <div id="contest-problem-empty" class="empty-state" style="display:none;">이 대회에는 아직 문제가 없어요.</div>
      </div>
    </section>

  </div>
</main>

<script src="js/supabase-client.js"></script>
<script src="js/tier.js"></script>
<script src="js/nav.js"></script>
<script>
async function init() {
  await renderNav("superadmin");
  const user = await requireAuth();
  if (!user) return;

  const { data: profile } = await sb.from("profiles").select("is_super_admin").eq("id", user.id).single();
  if (!profile?.is_super_admin) {
    document.getElementById("guard-msg").innerHTML = `<p style="color:var(--danger)">총관리자 계정만 접근할 수 있어요.</p>`;
    return;
  }
  document.getElementById("super-admin-body").style.display = "block";

  // 답 유형 전환
  document.getElementById("cp-answer-type").addEventListener("change", (e) => {
    const isObjective = e.target.value === "objective";
    document.getElementById("cp-objective-fields").style.display = isObjective ? "block" : "none";
    document.getElementById("cp-subjective-fields").style.display = isObjective ? "none" : "block";
  });

  // 대회 개최
  document.getElementById("contest-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("contest-msg");
    const title = document.getElementById("c-title").value.trim();
    const description = document.getElementById("c-description").value.trim();
    const starts_at = new Date(document.getElementById("c-starts").value).toISOString();
    const ends_at = new Date(document.getElementById("c-ends").value).toISOString();

    const { error } = await sb.from("contests").insert({
      title, description: description || null, starts_at, ends_at, created_by: user.id,
    });

    msg.textContent = error ? error.message : "대회를 만들었어요.";
    msg.className = "form-msg " + (error ? "form-msg--error" : "form-msg--success");
    if (!error) { e.target.reset(); loadContests(); }
  });

  async function loadContests() {
    const { data: contests } = await sb.from("contests").select("id, title, starts_at, ends_at").order("starts_at", { ascending: false });

    const listEl = document.getElementById("contests-admin-list");
    const contestSelect = document.getElementById("cp-contest");
    const filterSelect = document.getElementById("cpl-contest-filter");

    if (!contests || contests.length === 0) {
      listEl.innerHTML = `<div class="empty-state">아직 만든 대회가 없어요.</div>`;
      contestSelect.innerHTML = `<option value="">-- 대회를 먼저 만들어주세요 --</option>`;
      filterSelect.innerHTML = `<option value="">-- 대회 없음 --</option>`;
      return;
    }

    const now = new Date();
    listEl.innerHTML = contests.map(c => {
      const starts = new Date(c.starts_at);
      const ends = new Date(c.ends_at);
      const status = now < starts ? "예정" : (now > ends ? "종료" : "진행중");
      return `
        <div class="card" style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
          <div>
            <strong>${c.title}</strong>
            <span style="font-size:12px; color:var(--text-faint); margin-left:8px;">[${status}]</span>
            <div style="font-size:12px; color:var(--text-muted); margin-top:4px;">
              ${starts.toLocaleString("ko-KR")} ~ ${ends.toLocaleString("ko-KR")}
            </div>
          </div>
          <button class="btn btn--danger" data-delete-contest="${c.id}" style="font-size:13px; padding:6px 10px;">삭제</button>
        </div>
      `;
    }).join("");

    listEl.querySelectorAll("button[data-delete-contest]").forEach(btn => {
      btn.addEventListener("click", async () => {
        if (!confirm("이 대회를 삭제할까요? (연결된 문제는 삭제되지 않고 일반 문제로 남아요)")) return;
        await sb.from("contests").delete().eq("id", btn.dataset.deleteContest);
        loadContests();
      });
    });

    const optionsHtml = contests.map(c => `<option value="${c.id}">${c.title}</option>`).join("");
    contestSelect.innerHTML = optionsHtml;
    filterSelect.innerHTML = optionsHtml;
    loadContestProblems();
  }

  // 대회 문제 출제
  document.getElementById("contest-problem-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const msg = document.getElementById("contest-problem-msg");
    msg.textContent = ""; msg.className = "form-msg";

    const contest_id = document.getElementById("cp-contest").value;
    if (!contest_id) { msg.textContent = "대회를 먼저 선택해주세요."; msg.classList.add("form-msg--error"); return; }

    const subject = document.getElementById("cp-subject").value;
    const tier_level = parseInt(document.getElementById("cp-tier").value, 10);
    const title = document.getElementById("cp-title").value.trim();
    const content = document.getElementById("cp-content").value.trim();
    const answer_type = document.getElementById("cp-answer-type").value;

    const { data: problem, error: pErr } = await sb
      .from("problems")
      .insert({ subject, tier_level, title, content, answer_type, contest_id, created_by: user.id })
      .select()
      .single();

    if (pErr) { msg.textContent = pErr.message; msg.classList.add("form-msg--error"); return; }

    if (answer_type === "objective") {
      const lines = document.getElementById("cp-choices").value.split("\n").map(s => s.trim()).filter(Boolean);
      const correctIndex = parseInt(document.getElementById("cp-correct-index").value, 10) - 1;

      const choiceRows = lines.map((text, i) => ({ problem_id: problem.id, choice_order: i, choice_text: text }));
      const { data: insertedChoices, error: cErr } = await sb.from("problem_choices").insert(choiceRows).select();
      if (cErr) { msg.textContent = cErr.message; msg.classList.add("form-msg--error"); return; }

      const correctChoice = insertedChoices.find(c => c.choice_order === correctIndex);
      await sb.from("problem_answers").insert({ problem_id: problem.id, correct_answer: correctChoice?.id ?? "" });
    } else {
      const correctText = document.getElementById("cp-correct-text").value.trim();
      await sb.from("problem_answers").insert({ problem_id: problem.id, correct_answer: correctText });
    }

    msg.textContent = "대회 문제를 등록했어요.";
    msg.classList.add("form-msg--success");
    const keepContest = contest_id;
    e.target.reset();
    document.getElementById("cp-contest").value = keepContest;
    loadContestProblems();
  });

  async function loadContestProblems() {
    const contestId = document.getElementById("cpl-contest-filter").value;
    const rowsEl = document.getElementById("contest-problem-rows");
    const emptyEl = document.getElementById("contest-problem-empty");
    rowsEl.innerHTML = "";

    if (!contestId) { emptyEl.style.display = "block"; return; }

    const { data: problems } = await sb
      .from("problems")
      .select("id, subject, tier_level, title")
      .eq("contest_id", contestId)
      .order("created_at", { ascending: true });

    if (!problems || problems.length === 0) {
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    rowsEl.innerHTML = problems.map(p => {
      const tier = tierLevelToInfo(p.tier_level);
      return `
        <tr>
          <td style="color:var(--text-muted); font-size:13px;">${SUBJECTS[p.subject]?.label ?? p.subject}</td>
          <td><span class="tier-badge tier-badge--sm" style="--tier-color:${tier.color}"><span class="tier-badge__hex"></span>${tier.label}</span></td>
          <td>${p.title}</td>
          <td><button class="btn btn--ghost" data-delete-problem="${p.id}" style="font-size:12px; padding:5px 8px;">삭제</button></td>
        </tr>
      `;
    }).join("");

    rowsEl.querySelectorAll("button[data-delete-problem]").forEach(btn => {
      btn.addEventListener("click", async () => {
        if (!confirm("이 문제를 삭제할까요?")) return;
        await sb.from("problems").delete().eq("id", btn.dataset.deleteProblem);
        loadContestProblems();
      });
    });
  }

  document.getElementById("cpl-contest-filter").addEventListener("change", loadContestProblems);

  loadContests();
}

init();
</script>
</body>
</html>
