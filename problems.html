<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문제 · Nexus</title>
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.dataset.theme = localStorage.getItem("nexus-theme") || "dark";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
<div id="nav-root"></div>

<main class="page" style="padding-top:32px;">
  <h1>문제</h1>
  <div id="subject-tabs" class="subject-tabs"></div>

  <div style="display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;">
    <input id="title-search" type="text" placeholder="제목으로 검색" style="flex:1; min-width:160px;">
    <select id="tier-filter" style="min-width:120px;">
      <option value="all">전체 티어</option>
    </select>
  </div>

  <div class="card" style="padding:0; overflow:hidden;">
    <table class="problem-table">
      <thead>
        <tr><th style="width:36px;"></th><th style="width:150px;">티어</th><th>제목</th><th style="width:90px;">유형</th></tr>
      </thead>
      <tbody id="problem-rows"></tbody>
    </table>
    <div id="empty" class="empty-state" style="display:none;">아직 등록된 문제가 없어요.</div>
  </div>
</main>

<script src="js/supabase-client.js"></script>
<script src="js/tier.js"></script>
<script src="js/nav.js"></script>
<script>
let currentSubject = "math";
let allVisibleProblems = [];
let solvedIds = new Set();
let titleQuery = "";
let tierFilter = "all";

function renderTabs() {
  const el = document.getElementById("subject-tabs");
  el.innerHTML = SUBJECT_ORDER.map(key => {
    const s = SUBJECTS[key];
    return `<button class="subject-tab ${key === currentSubject ? "active" : ""}" data-subject="${key}" ${s.disabled ? "disabled" : ""}>
      ${s.icon} ${s.label} ${s.disabled ? '<span class="badge-soon">향후 개설</span>' : ""}
    </button>`;
  }).join("");

  el.querySelectorAll(".subject-tab:not([disabled])").forEach(btn => {
    btn.addEventListener("click", () => {
      currentSubject = btn.dataset.subject;
      renderTabs();
      loadProblems();
    });
  });
}

async function loadProblems() {
  const emptyEl = document.getElementById("empty");

  const { data: { user } } = await sb.auth.getUser();

  const { data: problems, error } = await sb
    .from("problems")
    .select("id, title, tier_level, answer_type, contest_id, contests(ends_at)")
    .eq("subject", currentSubject)
    .order("created_at", { ascending: true });

  if (error || !problems) {
    allVisibleProblems = [];
    emptyEl.style.display = "block";
    return;
  }

  // 대회 문제는 대회가 끝나기 전까지 일반 목록에서 숨김
  const now = new Date();
  allVisibleProblems = problems.filter(p => {
    if (!p.contest_id) return true;
    return p.contests && new Date(p.contests.ends_at) < now;
  });

  solvedIds = new Set();
  if (user) {
    const { data: solved } = await sb
      .from("solved_problems")
      .select("problem_id")
      .eq("user_id", user.id);
    solvedIds = new Set((solved ?? []).map(s => s.problem_id));
  }

  populateTierFilter();
  renderProblemList();
}

function populateTierFilter() {
  const select = document.getElementById("tier-filter");
  const prevValue = tierFilter;

  // 현재 과목에 실제로 존재하는 티어만 옵션으로 구성 (중복 제거, 티어 순서대로 정렬)
  const distinctTiers = [...new Set(allVisibleProblems.map(p => p.tier_level))].sort((a, b) => a - b);

  select.innerHTML = `<option value="all">전체 티어</option>` + distinctTiers.map(t => {
    const info = tierLevelToInfo(t);
    return `<option value="${t}">${info.label}</option>`;
  }).join("");

  // 과목을 바꿔서 이전에 고른 티어가 이번 과목엔 없으면 전체로 리셋
  if (prevValue !== "all" && !distinctTiers.includes(Number(prevValue))) {
    tierFilter = "all";
  }
  select.value = tierFilter;
}

function renderProblemList() {
  const rowsEl = document.getElementById("problem-rows");
  const emptyEl = document.getElementById("empty");

  const query = titleQuery.trim().toLowerCase();
  const filtered = allVisibleProblems.filter(p => {
    if (tierFilter !== "all" && String(p.tier_level) !== String(tierFilter)) return false;
    if (query && !p.title.toLowerCase().includes(query)) return false;
    return true;
  });

  if (filtered.length === 0) {
    rowsEl.innerHTML = "";
    emptyEl.style.display = "block";
    emptyEl.textContent = allVisibleProblems.length === 0
      ? "아직 등록된 문제가 없어요."
      : "검색 조건에 맞는 문제가 없어요.";
    return;
  }
  emptyEl.style.display = "none";

  rowsEl.innerHTML = filtered.map(p => {
    const tier = tierLevelToInfo(p.tier_level);
    const solved = solvedIds.has(p.id);
    return `
      <tr onclick="window.location.href='problem.html?id=${p.id}'" style="cursor:pointer;">
        <td class="${solved ? "problem-row-solved" : ""}">${solved ? "✓" : ""}</td>
        <td><span class="tier-badge tier-badge--sm" style="--tier-color:${tier.color}"><span class="tier-badge__hex"></span>${tier.label}</span></td>
        <td class="problem-row-title">${p.title}</td>
        <td style="color:var(--text-muted); font-size:13px;">${p.answer_type === "objective" ? "객관식" : "주관식"}</td>
      </tr>
    `;
  }).join("");
}

let searchDebounceTimer = null;
document.getElementById("title-search").addEventListener("input", (e) => {
  clearTimeout(searchDebounceTimer);
  searchDebounceTimer = setTimeout(() => {
    titleQuery = e.target.value;
    renderProblemList();
  }, 200);
});

document.getElementById("tier-filter").addEventListener("change", (e) => {
  tierFilter = e.target.value;
  renderProblemList();
});

(async function init() {
  const params = new URLSearchParams(window.location.search);
  if (params.get("subject") && SUBJECTS[params.get("subject")] && !SUBJECTS[params.get("subject")].disabled) {
    currentSubject = params.get("subject");
  }
  await renderNav("problems");
  renderTabs();
  loadProblems();
})();
</script>
</body>
</html>
