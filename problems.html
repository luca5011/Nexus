<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문제 · Nexus</title>
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.dataset.theme = localStorage.getItem("nexus-theme") || "dark";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="nav-root"></div>

<main class="page" style="padding-top:32px;">
  <h1>문제</h1>
  <div id="subject-tabs" class="subject-tabs"></div>
  
  <!-- 🔍 여기에 실시간 검색바 UI를 추가했습니다. -->
  <div class="search-container" style="margin-bottom: 20px;">
    <input type="text" id="problem-search" placeholder="문제 제목을 입력하여 검색하세요..." 
           style="width: 100%; padding: 12px 16px; font-size: 15px; background: var(--bg-card, #1e1e24); color: var(--text-main, #ffffff); border: 1px solid var(--border-color, #3f3f46); border-radius: 8px; outline: none; box-sizing: border-box;">
  </div>

  <div class="card" style="padding:0; overflow:hidden;">
    <table class="problem-table">
      <thead>
        <tr><th style="width:36px;"></th><th style="width:150px;">티어</th><th>제목</th><th style="width:90px;">유형</th></tr>
      </thead>
      <tbody id="problem-rows"></tbody>
    </table>
    <div id="empty" class="empty-state" style="display:none;">아직 등록된 문제가 없어요.</div>
  </div>
</main>

<script src="js/supabase-client.js"></script>
<script src="js/tier.js"></script>
<script src="js/nav.js"></script>
<script>
let currentSubject = "math";
let allProblems = []; // 💡 현재 과목의 전체 문제를 백업 보관할 배열
let solvedIds = new Set(); // 💡 맞춘 문제 ID 목록을 전역 관리

function renderTabs() {
  const el = document.getElementById("subject-tabs");
  el.innerHTML = SUBJECT_ORDER.map(key => {
    const s = SUBJECTS[key];
    return `<button class="subject-tab ${key === currentSubject ? "active" : ""}" data-subject="${key}" ${s.disabled ? "disabled" : ""}>
      ${s.icon} ${s.label} ${s.disabled ? '<span class="badge-soon">향후 개설</span>' : ""}
    </button>`;
  }).join("");

  el.querySelectorAll(".subject-tab:not([disabled])").forEach(btn => {
    btn.addEventListener("click", () => {
      currentSubject = btn.dataset.subject;
      
      // 💡 과목을 변경하면 검색창 내용을 비워줍니다.
      const searchInput = document.getElementById("problem-search");
      if (searchInput) searchInput.value = "";
      
      renderTabs();
      loadProblems();
    });
  });
}

// 💡 DB에서 데이터를 완전히 가져온 뒤, 필터링하여 실시간으로 그리는 분리 함수
function renderProblemRows(keyword = "") {
  const rowsEl = document.getElementById("problem-rows");
  const emptyEl = document.getElementById("empty");
  rowsEl.innerHTML = "";

  const cleanKeyword = keyword.toLowerCase().trim();

  // 검색어가 있으면 입력값에 맞는 문제만 필터링합니다.
  const filteredProblems = allProblems.filter(p => 
    p.title ? p.title.toLowerCase().includes(cleanKeyword) : false
  );

  if (filteredProblems.length === 0) {
    rowsEl.innerHTML = "";
    emptyEl.textContent = keyword ? "검색 결과와 일치하는 문제가 없습니다." : "아직 등록된 문제가 없어요.";
    emptyEl.style.display = "block";
    return;
  }
  emptyEl.style.display = "none";

  rowsEl.innerHTML = filteredProblems.map(p => {
    const tier = tierLevelToInfo(p.tier_level);
    const solved = solvedIds.has(p.id);
    return `
      <tr onclick="window.location.href='problem.html?id=${p.id}'" style="cursor:pointer;">
        <td class="${solved ? "problem-row-solved" : ""}">${solved ? "✓" : ""}</td>
        <td><span class="tier-badge tier-badge--sm" style="--tier-color:${tier.color}"><span class="tier-badge__hex"></span>${tier.label}</span></td>
        <td class="problem-row-title">${p.title}</td>
        <td style="color:var(--text-muted); font-size:13px;">${p.answer_type === "objective" ? "객관식" : "주관식"}</td>
      </tr>
    `;
  }).join("");
}

async function loadProblems() {
  const emptyEl = document.getElementById("empty");
  
  const { data: { user } } = await sb.auth.getUser();

  const { data: problems, error } = await sb
    .from("problems")
    .select("id, title, tier_level, answer_type")
    .eq("subject", currentSubject)
    .order("created_at", { ascending: true });

  if (error || !problems || problems.length === 0) {
    allProblems = [];
    emptyEl.textContent = "아직 등록된 문제가 없어요.";
    emptyEl.style.display = "block";
    document.getElementById("problem-rows").innerHTML = "";
    return;
  }

  // 💡 데이터 받아온 직후 전역 변수에 상태 저장
  allProblems = problems;

  if (user) {
    const { data: solved } = await sb
      .from("solved_problems")
      .select("problem_id")
      .eq("user_id", user.id);
    solvedIds = new Set((solved ?? []).map(s => s.problem_id));
  } else {
    solvedIds = new Set();
  }

  // 💡 초기 로드는 빈 값(전체 노출)으로 그리기 함수 트리거
  renderProblemRows("");
}

(async function init() {
  const params = new URLSearchParams(window.location.search);
  if (params.get("subject") && SUBJECTS[params.get("subject")] && !SUBJECTS[params.get("subject")].disabled) {
    currentSubject = params.get("subject");
  }
  await renderNav("problems");
  renderTabs();
  await loadProblems(); // loadProblems의 완료를 보장

  // 💡 검색바 입력 이벤트 리스너 바인딩
  const searchInput = document.getElementById("problem-search");
  if (searchInput) {
    searchInput.addEventListener("input", (e) => {
      renderProblemRows(e.target.value);
    });
  }
})();
</script>
</body>
</html>
