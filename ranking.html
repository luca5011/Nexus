<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>랭킹 · Nexus</title>
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.dataset.theme = localStorage.getItem("nexus-theme") || "dark";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
<div id="nav-root"></div>

<main class="page" style="padding-top:32px;">
  <h1>랭킹</h1>
  <p>통합 탭에서는 전체 과목 합산 순위를, 과목 탭에서는 과목별 레이팅 순위를 볼 수 있어요.</p>
  <div id="subject-tabs" class="subject-tabs"></div>

  <div class="card" style="padding:0; overflow:hidden;">
    <table class="rank-table">
      <thead><tr><th>순위</th><th>유저</th><th id="tier-col-header">티어</th><th>레이팅</th><th>푼 문제</th></tr></thead>
      <tbody id="rank-rows"></tbody>
    </table>
    <div id="empty" class="empty-state" style="display:none;">아직 랭킹 데이터가 없어요.</div>
  </div>
</main>

<script src="js/supabase-client.js"></script>
<script src="js/tier.js"></script>
<script src="js/nav.js"></script>
<script>
let currentSubject = "overall";

function renderTabs() {
  const el = document.getElementById("subject-tabs");
  const subjectTabs = SUBJECT_ORDER.filter(k => !SUBJECTS[k].disabled).map(key => {
    const s = SUBJECTS[key];
    return `<button class="subject-tab ${key === currentSubject ? "active" : ""}" data-subject="${key}">${s.icon} ${s.label}</button>`;
  }).join("");

  el.innerHTML = `<button class="subject-tab ${currentSubject === "overall" ? "active" : ""}" data-subject="overall">🏆 통합</button>` + subjectTabs;

  el.querySelectorAll(".subject-tab").forEach(btn => {
    btn.addEventListener("click", () => {
      currentSubject = btn.dataset.subject;
      renderTabs();
      loadRanking();
    });
  });
}

async function loadRanking() {
  const rowsEl = document.getElementById("rank-rows");
  const emptyEl = document.getElementById("empty");
  rowsEl.innerHTML = "";

  if (currentSubject === "overall") {
    document.getElementById("tier-col-header").style.display = "none";

    const { data, error } = await sb.rpc("get_overall_ranking", { p_limit: 100 });

    if (error || !data || data.length === 0) {
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";

    rowsEl.innerHTML = data.map((row, i) => `
      <tr onclick="window.location.href='profile.html?id=${row.user_id}'" style="cursor:pointer;">
        <td class="rank-num">${i + 1}</td>
        <td>${row.username ?? "알 수 없음"}</td>
        <td style="font-family:var(--font-mono);">${Math.round(row.total_rating)}</td>
        <td style="color:var(--text-muted);">${row.total_solved}</td>
      </tr>
    `).join("");
    return;
  }

  document.getElementById("tier-col-header").style.display = "";

  const { data, error } = await sb
    .from("user_tiers")
    .select("user_id, rating, solved_count, profiles(username)")
    .eq("subject", currentSubject)
    .order("rating", { ascending: false })
    .limit(100);

  if (error || !data || data.length === 0) {
    emptyEl.style.display = "block";
    return;
  }
  emptyEl.style.display = "none";

  rowsEl.innerHTML = data.map((row, i) => {
    const tier = ratingToTierDisplay(row.rating);
    return `
      <tr onclick="window.location.href='profile.html?id=${row.user_id}'" style="cursor:pointer;">
        <td class="rank-num">${i + 1}</td>
        <td>${row.profiles?.username ?? "알 수 없음"}</td>
        <td><span class="tier-badge tier-badge--sm" style="--tier-color:${tier.color}"><span class="tier-badge__hex"></span>${tier.label}</span></td>
        <td style="font-family:var(--font-mono);">${Math.round(row.rating)}</td>
        <td style="color:var(--text-muted);">${row.solved_count}</td>
      </tr>
    `;
  }).join("");
}
  
(async function init() {
  await renderNav("ranking");
  renderTabs();
  loadRanking();
})();
</script>
</body>
</html>
