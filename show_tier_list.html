<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus 티어 목록</title>
    <link rel="stylesheet" href="css/style.css">
    <script>document.documentElement.dataset.theme = localStorage.getItem("nexus-theme") || "dark";</script>
    <script src="https://jsdelivr.net"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg, #1e1e24);
            color: var(--text, #ffffff);
            margin: 0;
            padding: 0;
        }
        .content-wrapper {
            padding: 40px 24px;
        }
        h1 {
            text-align: center;
            margin-bottom: 40px;
            color: var(--accent, #e8c547);
        }
        .tier-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 무조건 한 줄에 3개 고정 */
            gap: 20px;
            max-width: 1040px;
            margin: 0 auto;
        }
        .tier-card {
            background-color: #2a2a35;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border-top: 5px solid var(--tier-color, #fff);
        }
        .tier-level { 
            font-size: 0.85rem; 
            color: #aaa; 
            margin-bottom: 10px; 
        }
        .tier-rating-range { 
            font-size: 0.9rem; 
            color: #ccc; 
            margin-top: 15px; 
        }
        .tier-badge {
            display: inline-flex;
            align-items: center; /* 자식 요소들을 세로 중앙 정렬 */
            justify-content: center;
            gap: 8px; /* 육각형과 글자 사이 간격 */
            padding: 6px 12px;
            border-radius: 20px;
            background-color: rgba(255, 255, 255, 0.1);
            font-weight: bold;
            color: var(--tier-color, #fff);
        }
        .tier-badge--lg { 
            font-size: 1.2rem; 
            padding: 10px 20px; 
        }
        .tier-badge__hex {
            display: block; /* 흐트러짐 방지를 위해 block 또는 flex-item으로 고정 */
            flex-shrink: 0; /* 크기가 찌그러지지 않도록 보호 */
            width: 10px;
            height: 10px;
            background-color: var(--tier-color, #fff);
            transform: rotate(45deg);
            margin-right: 2px; /* 회전으로 인한 시각적 치우침 보정 */
        }
    </style>
</head>
<body>

    <!-- 상단바가 들어가는 구역 -->
    <div id="nav-root"></div>

    <div class="content-wrapper">
        <h1>Nexus 전체 티어 로드맵</h1>
        <div id="tierContainer" class="tier-grid"></div>
    </div>

    <!-- 필요한 스크립트 순서대로 로드 -->
    <script src="js/supabase-client.js"></script>
    <script src="js/tier.js"></script>
    <script src="js/nav.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            // 상단바 컴포넌트 렌더링 (활성화 탭: 'tiers')
            if (typeof renderNav === "function") {
                await renderNav("tiers");
            }

            const container = document.getElementById("tierContainer");

            // 0레벨부터 최대 레벨까지 카드 생성
            for (let level = 0; level <= MAX_TIER_LEVEL; level++) {
                const info = tierLevelToInfo(level);
                const minRating = level * RATING_PER_LEVEL;
                
                const card = document.createElement("div");
                card.className = "tier-card";
                card.style.setProperty("--tier-color", info.color);

                const levelEl = document.createElement("div");
                levelEl.className = "tier-level";
                levelEl.innerText = `LEVEL ${level}`;
                card.appendChild(levelEl);

                const badgeEl = renderTierBadge(minRating, { size: "lg" });
                card.appendChild(badgeEl);

                const ratingEl = document.createElement("div");
                ratingEl.className = "tier-rating-range";
                ratingEl.innerText = `컷: ${minRating} 점`;
                card.appendChild(ratingEl);

                container.appendChild(card);
            }
        });
    </script>
</body>
</html>
