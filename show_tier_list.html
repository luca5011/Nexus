<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus 티어 목록</title>
    <!-- 티어 배지 스타일링 (원하는 대로 수정 가능) -->
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            color: #ffffff;
            padding: 40px;
            margin: 0;
        }
        h1 {
            text-align: center;
            margin-bottom: 40px;
            color: #e8c547;
        }
        /* 티어 그리드 레이아웃: 화면 너비와 상관없이 무조건 한 줄에 3개 고정 */
        .tier-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3열 고정 */
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 개별 티어 카드 */
        .tier-card {
            background-color: #2a2a35;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border-top: 5px solid var(--tier-color, #fff);
            transition: transform 0.2s;
        }
        .tier-card:hover {
            transform: translateY(-5px);
        }
        .tier-level {
            font-size: 0.85rem;
            color: #aaa;
            margin-bottom: 10px;
        }
        .tier-rating-range {
            font-size: 0.9rem;
            color: #ccc;
            margin-top: 15px;
        }
        /* tier.js 내부 renderTierBadge 구조에 맞춘 기본 CSS 선언 */
        .tier-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            background-color: rgba(255, 255, 255, 0.1);
            font-weight: bold;
            color: var(--tier-color, #fff);
        }
        .tier-badge--lg {
            font-size: 1.2rem;
            padding: 10px 20px;
        }
        .tier-badge__hex {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: var(--tier-color, #fff);
            transform: rotate(45deg);
        }
    </style>
</head>
<body>

    <h1>Nexus 전체 티어 로드맵</h1>
    
    <!-- 티어들이 생성될 컨테이너 -->
    <div id="tierContainer" class="tier-grid"></div>

    <!-- 1. 먼저 tier.js 파일을 불러옵니다 (동일 폴더의 js 폴더 안에 있다고 가정) -->
    <script src="./js/tier.js"></script>

    <!-- 2. 모든 티어를 화면에 렌더링하는 스크립트 -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById("tierContainer");

            // MAX_TIER_LEVEL(17)까지 반복하며 모든 티어 정보를 가져옵니다.
            // tier.js 내부 변수 접근을 위해 tierLevelToInfo 함수를 활용합니다.
            for (let level = 0; level <= MAX_TIER_LEVEL; level++) {
                
                // 1. 해당 레벨의 티어 정보 가져오기
                const info = tierLevelToInfo(level);
                
                // 2. 해당 티어가 시작되는 최소 레이팅 계산 (단계별 150 레이팅)
                const minRating = level * RATING_PER_LEVEL;
                
                // 3. 카드 엘리먼트 생성
                const card = document.createElement("div");
                card.className = "tier-card";
                card.style.setProperty("--tier-color", info.color); // CSS 테두리 및 색상 연동

                // 4. 상단 레벨 표시 생성
                const levelEl = document.createElement("div");
                levelEl.className = "tier-level";
                levelEl.innerText = `LEVEL ${level}`;
                card.appendChild(levelEl);

                // 5. tier.js 내장 함수인 renderTierBadge를 사용하여 배지 DOM 추가
                // 힌트: 배지가 정상 노출되도록 최소 레이팅 값을 넣어줍니다.
                const badgeEl = renderTierBadge(minRating, { size: "lg" });
                card.appendChild(badgeEl);

                // 6. 하단 레이팅 커트라인 정보 추가
                const ratingEl = document.createElement("div");
                ratingEl.className = "tier-rating-range";
                ratingEl.innerText = `컷: ${minRating} 점`;
                card.appendChild(ratingEl);

                // 컨테이너에 카드 삽입
                container.appendChild(card);
            }
        });
    </script>
</body>
</html>
