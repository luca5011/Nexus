<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus</title>
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.dataset.theme = localStorage.getItem("nexus-theme") || "dark";</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="icon" type="image/png" href="https://i.ibb.co/qY1f930g/2026-07-31-095958.png">
</head>
<body>
<div id="nav-root"></div>

<div style="display:flex; justify-content:flex-end; gap:8px; max-width:1040px; margin:0 auto; padding:10px 24px 0;">
  <a href="show_tier_list.html" class="btn btn--ghost" style="padding:5px 10px; font-size:12px;">전체 티어 목록</a>
  <a href="promo.html" class="btn btn--ghost" style="padding:5px 10px; font-size:12px;">홍보</a>
</div>

<main class="page">
  <section class="hero">
    <h1>Learn, <span style="color:var(--accent)">Solve</span>, Develop.</h1>
    <p class="sub">과목별 독립 티어, Elo 기반 레이팅, 승급 보상 코인까지 — 문제를 풀수록 쌓이는 나만의 실력 그래프.</p>
    <div id="hero-cta"></div>
    <div id="tier-grid" class="tier-grid"></div>
  </section>
</main>

<script src="js/supabase-client.js"></script>
<script src="js/tier.js"></script>
<script src="js/nav.js"></script>
<script>
async function initHome() {
  await renderNav("home");

  const ctaEl = document.getElementById("hero-cta");
  const gridEl = document.getElementById("tier-grid");

  let user = null;
  try {
    const { data } = await sb.auth.getUser();
    user = data.user;
  } catch (err) {
    console.error("initHome: getUser 실패", err);
  }

if (!user) {
  ctaEl.innerHTML = `
    <a class="btn btn--primary" href="signup.html" style="margin-top:10px;">지금 시작하기</a>
    <a class="btn btn--ghost" href="problems.html" style="margin-top:10px;">문제 둘러보기</a>
  `;
  gridEl.innerHTML = "";
  return;
}

  const { data: tiers } = await sb
    .from("user_tiers")
    .select("subject, rating, solved_count")
    .eq("user_id", user.id);

  gridEl.innerHTML = SUBJECT_ORDER.filter(s => !SUBJECTS[s].disabled).map(subjectKey => {
    const row = tiers?.find(t => t.subject === subjectKey);
    const rating = row?.rating ?? 0;
    const display = ratingToTierDisplay(rating);
    return `
      <div class="tier-card">
        <div class="tier-card__subject">${SUBJECTS[subjectKey].icon} ${SUBJECTS[subjectKey].label}</div>
        <span class="tier-badge tier-badge--lg" style="--tier-color:${display.color}">
          <span class="tier-badge__hex"></span>${display.label}
        </span>
        <div class="tier-card__bar"><div class="tier-card__bar-fill" style="width:${display.progressPct}%; --tier-color:${display.color}"></div></div>
        <div class="tier-card__remaining">${display.isMax ? "최고 티어 달성" : `다음 승급까지 레이팅 ${Math.ceil(display.remaining)} 남음`}</div>
      </div>
    `;
  }).join("");
}

initHome();
</script>
</body>
</html>
