<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원가입 · 멀티과목 OJ</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="nav-root"></div>

<main class="container-narrow" style="padding-top:56px;">
  <h1>회원가입</h1>
  <p>이메일 인증 후 로그인할 수 있어요.</p>

  <form id="signup-form" class="card">
    <div class="field">
      <label for="username">아이디</label>
      <input id="username" type="text" required minlength="3" maxlength="20" placeholder="영문/숫자 3~20자">
    </div>
    <div class="field">
      <label for="email">이메일</label>
      <input id="email" type="email" required placeholder="you@example.com">
    </div>
    <div class="field">
      <label for="password">비밀번호</label>
      <input id="password" type="password" required minlength="6" placeholder="6자 이상">
    </div>
    <button type="submit" class="btn btn--primary btn--block">가입하기</button>
    <div id="msg" class="form-msg"></div>
  </form>

  <p style="margin-top:16px; text-align:center;">이미 계정이 있나요? <a href="login.html" style="color:var(--accent)">로그인</a></p>
</main>

<script src="js/supabase-client.js"></script>
<script src="js/tier.js"></script>
<script src="js/nav.js"></script>
<script>
renderNav(null);

document.getElementById("signup-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg");
  msg.textContent = "";
  msg.className = "form-msg";

  const username = document.getElementById("username").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { error } = await supabase.auth.signUp({
    email,
    password,
    options: { data: { username } },
  });

  if (error) {
    msg.textContent = error.message;
    msg.classList.add("form-msg--error");
    return;
  }

  msg.textContent = "가입 확인 메일을 보냈어요. 메일함을 확인해주세요.";
  msg.classList.add("form-msg--success");
});
</script>
</body>
</html>
